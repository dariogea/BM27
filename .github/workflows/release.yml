name: Publicar versión (Windows)

# Compila el instalador .exe de BM27 para Windows y, si se pide, lo publica en GitHub Releases.
#
#  - Al subir una etiqueta de versión (por ejemplo v0.1.0-alpha.1) se compila y se PUBLICA.
#  - A mano (Actions → «Publicar versión (Windows)» → Run workflow) se puede compilar sin
#    publicar (queda como artefacto descargable) o publicar escribiendo una etiqueta.
#
# Las versiones con guion (alpha, beta, rc) se publican como «pre-lanzamiento».
# Los minutos de Windows cuentan el doble en GitHub Actions: no se lanza en cada PR.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta a publicar (por ejemplo v0.1.0-alpha.1). Vacío = solo compilar, sin publicar.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: Compilar instalador para Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta las etiquetas para comprobar a qué commit apunta cada una.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests (no se publica una versión rota)
        run: pnpm test

      - name: Comprobar etiqueta, versión y commit (tools/ci/release-check.mjs)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: node tools/ci/release-check.mjs

      - name: Compilar el instalador
        run: pnpm --filter @bm27/desktop tauri build

      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bm27-windows-instalador
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Verificar instalación y arranque en Windows
        shell: pwsh
        run: |
          try {
            ./tools/ci/smoke-windows-installer.ps1 `
              -BuildDirectory apps/desktop/src-tauri/target/release `
              -BundleDirectory apps/desktop/src-tauri/target/release/bundle/nsis
          } catch {
            Write-Output "::error title=Prueba de instalación::$(($_.Exception.Message -replace '[\r\n]+', ' '))"
            throw
          }

      - name: Publicar en GitHub Releases
        if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          # --target fija la etiqueta (si aún no existe) en el commit exacto que se ha compilado.
          # Nunca se sustituye una Release existente: la comprobación anterior ya la rechaza.
          # Notas de la versión: docs/versiones/<versión>.md si existe; si no, un texto genérico.
          NOTES_FILE="docs/versiones/${TAG#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES=(--notes-file "$NOTES_FILE")
          else
            NOTES=(--notes "Versión de prueba de BM27 para Windows. Descarga el archivo \`.exe\` y ejecútalo. Si Windows muestra «Windows protegió su PC», pulsa «Más información» y «Ejecutar de todos modos» (el instalador no está firmado con un certificado de pago).")
          fi
          gh release create "$TAG" apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" \
            --title "BM27 $TAG" $FLAGS \
            "${NOTES[@]}"
