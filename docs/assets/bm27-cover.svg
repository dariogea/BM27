<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="title desc">
  <title id="title">BM27 — El club en tus manos</title>
  <desc id="desc">Identidad visual de Basketball Manager 2027 sobre una pista de baloncesto esquemática. Prototipo en desarrollo; no es una captura del juego.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#192d40"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#496075" stroke-opacity=".13"/></pattern>
    <linearGradient id="edge"><stop stop-color="#f7b548"/><stop offset="1" stop-color="#df7e37"/></linearGradient>
  </defs>
  <rect width="1280" height="380" rx="16" fill="url(#background)"/>
  <rect width="1280" height="380" rx="16" fill="url(#grid)"/>
  <path d="M0 365H1280" stroke="url(#edge)" stroke-width="8"/>
  <g fill="none" stroke="#9fb4c5" stroke-width="2" opacity=".28" transform="translate(850 26)">
    <rect x="0" y="0" width="360" height="328" rx="2"/>
    <path d="M0 164H360M100 0V64H260V0M100 328V264H260V328"/>
    <circle cx="180" cy="164" r="40"/>
    <path d="M100 64A80 80 0 0 0 260 64M100 264A80 80 0 0 1 260 264M18 0V30A164 164 0 0 0 342 30V0M18 328V298A164 164 0 0 1 342 298V328"/>
    <path d="M150 22H210M150 306H210" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#f7b548" stroke-width="3" transform="translate(850 26)">
    <circle cx="180" cy="34" r="7"/><circle cx="180" cy="294" r="7"/>
    <path d="M70 220L138 176L240 192" stroke-dasharray="7 7"/>
    <circle cx="70" cy="220" r="8"/><circle cx="138" cy="176" r="8"/><circle cx="240" cy="192" r="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="66" fill="#f7b548" font-size="14" font-weight="700" letter-spacing="4">BASKETBALL MANAGER 2027</text>
    <text x="58" y="182" fill="#f6f2e9" font-size="112" font-weight="800" letter-spacing="-5">BM27<tspan fill="#f7b548">.</tspan></text>
    <text x="64" y="244" fill="#f6f2e9" font-size="34" font-weight="700">El club en tus manos.</text>
    <text x="64" y="286" fill="#bdcbd6" font-size="18">Decide en el banquillo. Construye desde el despacho.</text>
    <text x="64" y="333" fill="#f7b548" font-size="12" font-weight="700" letter-spacing="2">PROTOTIPO JUGABLE  /  DATOS DEMO  /  EN DESARROLLO</text>
  </g>
</svg>
