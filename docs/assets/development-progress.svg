<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Preparación del producto: 19 %</title><desc id="desc">Cobertura del plan por fases y peso de cada fase. La profundidad de gestión tiene el mayor peso. Es una estimación de planificación.</desc><rect width="1200" height="480" rx="16" fill="#0b1423"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f7b548" font-size="25" font-weight="700">BM27 · Preparación estimada: 19 %</text><text x="32" y="76" fill="#aabccc" font-size="15">Objetivo: producto completo. El 100 % exige todos los criterios de lanzamiento validados.</text><text x="32" y="118" fill="#dce5ee" font-size="16">F0 · Fundaciones</text><rect x="430" y="103" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="103" width="319.0090909090909" height="16" rx="8" fill="#f7b548"/><text x="874" y="118" fill="#f7b548" font-size="16">76 %</text><text x="1020" y="118" fill="#aabccc" font-size="14">Peso 5 %</text><text x="32" y="166" fill="#dce5ee" font-size="16">F1 · Primera versión jugable</text><rect x="430" y="151" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="151" width="252.9767441860465" height="16" rx="8" fill="#f7b548"/><text x="874" y="166" fill="#f7b548" font-size="16">60 %</text><text x="1020" y="166" fill="#aabccc" font-size="14">Peso 10 %</text><text x="32" y="214" fill="#dce5ee" font-size="16">F2 · Profundidad de gestión</text><rect x="430" y="199" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="199" width="26.706521739130434" height="16" rx="8" fill="#f7b548"/><text x="874" y="214" fill="#f7b548" font-size="16">6 %</text><text x="1020" y="214" fill="#aabccc" font-size="14">Peso 40 %</text><text x="32" y="262" fill="#dce5ee" font-size="16">F3 · Mundo, datos y mods</text><rect x="430" y="247" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="247" width="39.333333333333336" height="16" rx="8" fill="#f7b548"/><text x="874" y="262" fill="#f7b548" font-size="16">9 %</text><text x="1020" y="262" fill="#aabccc" font-size="14">Peso 15 %</text><text x="32" y="310" fill="#dce5ee" font-size="16">F4 · Presentación</text><rect x="430" y="295" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="295" width="115.5" height="16" rx="8" fill="#f7b548"/><text x="874" y="310" fill="#f7b548" font-size="16">28 %</text><text x="1020" y="310" fill="#aabccc" font-size="14">Peso 15 %</text><text x="32" y="358" fill="#dce5ee" font-size="16">F5 · Distribución</text><rect x="430" y="343" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="343" width="80.18181818181819" height="16" rx="8" fill="#f7b548"/><text x="874" y="358" fill="#f7b548" font-size="16">19 %</text><text x="1020" y="358" fill="#aabccc" font-size="14">Peso 5 %</text><text x="32" y="406" fill="#dce5ee" font-size="16">F6 · Pulido y lanzamiento</text><rect x="430" y="391" width="420" height="16" rx="8" fill="#25384b"/><rect x="430" y="391" width="24.70588235294118" height="16" rx="8" fill="#f7b548"/><text x="874" y="406" fill="#f7b548" font-size="16">6 %</text><text x="1020" y="406" fill="#aabccc" font-size="14">Peso 10 %</text><text x="32" y="464" fill="#aabccc" font-size="13">Las barras muestran cobertura de tareas de cada fase, no paridad verificada con otro producto.</text></g></svg>
